name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Inject an option file to bypass dependency loops
          echo "pip_options: --no-dependencies" >> README.md
          
          # 2. Force sync the code base over
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add README.md
          git commit -m "deploy: inject no-deps override" || true
          git push --force https://attem03:$HF_TOKEN@huggingface.co/spaces/attem03/PortfolioRAG main
